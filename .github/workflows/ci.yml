name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Reviewed nonzero base ref or SHA for protocol discipline recovery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full Node contract (PR target base)
        if: github.event_name == 'pull_request'
        env:
          POSTBOX_BASE_REF: origin/${{ github.base_ref }}
        run: npm run check:full -- --part node --base "$POSTBOX_BASE_REF"
      - name: Full Node contract (previous push SHA)
        if: github.event_name == 'push'
        env:
          POSTBOX_BEFORE_SHA: ${{ github.event.before }}
        # Zero or unavailable previous SHAs fail closed; use workflow_dispatch.
        run: npm run check:full -- --part node --push "$POSTBOX_BEFORE_SHA"
      - name: Full Node contract (reviewed recovery base)
        if: github.event_name == 'workflow_dispatch'
        env:
          POSTBOX_BASE_REF: ${{ inputs.base }}
        run: npm run check:full -- --part node --base "$POSTBOX_BASE_REF"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Full Android contract
        run: npm run check:full -- --part android
      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/lint-results-debug.*
